# Runs the same checks as the pre-commit hook, plus the full test suite,
# the API typecheck and a production build, on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (app)
        run: npx tsc -b

      - name: Typecheck (API)
        run: npx tsc -p tsconfig.api.json

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
